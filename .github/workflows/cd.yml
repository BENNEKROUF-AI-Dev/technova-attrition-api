name: CD — Déploiement Hugging Face Spaces
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    name: Déploiement (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Récupérer tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pousser vers Hugging Face sans les binaires
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          # Supprimer le PNG du répertoire de travail
          rm -f docs/schema_bdd.png

          # Créer une branche orpheline (sans historique)
          git checkout --orphan hf-deploy

          # Stager tous les fichiers sauf le PNG
          git add .
          git commit -m "chore: deploy to Hugging Face"

          # Pousser la branche orpheline sur main HF
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}.git" \
            hf-deploy:main
