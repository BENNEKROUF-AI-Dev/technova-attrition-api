name: CD — Déploiement Hugging Face Spaces
# Déploiement en production à chaque fusion sur main (ou manuellement).
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    name: Déploiement (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Récupérer tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exclure les fichiers binaires non supportés par HF
        run: |
          git rm --cached docs/schema_bdd.png --ignore-unmatch
          git commit -m "chore: exclude binary PNG from HF push" --allow-empty
      - name: Pousser le code vers le Space Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}.git" \
            main
